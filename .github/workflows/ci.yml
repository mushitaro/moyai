name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 履歴とタグが全部あるか（差分 0 と凍結のタグの試験に要る）
        run: test "$(git rev-parse --is-shallow-repository)" = "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: 依存を入れる（npm 11、スクリプトは走らせない）
        run: npx -y npm@11.21.1 ci --ignore-scripts
      - name: 使わない依存（AG Grid の Enterprise）が無いか
        run: node scripts/check-deps.mjs
      - name: 試験（0 件なら失敗）
        run: node scripts/run-tests.mjs
      - name: 公開の前の検査
        run: node scripts/check-publish.mjs
