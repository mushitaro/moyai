name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 履歴とタグが全部あるか（差分 0 と凍結のタグの試験に要る）
        run: test "$(git rev-parse --is-shallow-repository)" = "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: 依存を入れる（npm 11、スクリプトは走らせない）
        run: npx -y npm@11.21.1 ci --ignore-scripts
      - name: 使わない依存（AG Grid の Enterprise）が無いか
        run: node scripts/check-deps.mjs
      - name: ビルド（画面は Vite、dist/cli.js は Vite の SSR のビルド）
        run: npm run build
      - name: 型の検査（TypeScript 7 の tsc --noEmit）
        run: npm run typecheck
      - name: 試験（node:test と vitest。どちらかが 0 件なら失敗）
        env:
          MOYAI_REQUIRE_DIST: "1"
        run: node scripts/run-tests.mjs
      - name: 公開の前の検査
        run: node scripts/check-publish.mjs
      - name: Skill の文の採点の記録（文を変えたら、記録が今の文に合い、点が main より下がっていないか。docs/autonomy.md）
        if: matrix.os == 'ubuntu-latest'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then node scripts/skill-scores/check.mjs --base "origin/$BASE_REF"; else node scripts/skill-scores/check.mjs; fi

  pack-bench:
    name: pack-bench（Skillパックの物差し）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: 依存を入れる（npm 11、スクリプトは走らせない）
        run: npx -y npm@11.21.1 ci --ignore-scripts
      - name: 物差しを測る（工場 v2 の施設。AI も API も使わない）
        run: node scripts/bench/pack-bench.mjs waste-incineration --out "$RUNNER_TEMP/bench"
      - name: 記録した表（eval/bench/）と比べる（数が違えば落ちる）
        run: |
          set +e
          node scripts/bench/compare.mjs eval/bench/waste-incineration/result.json "$RUNNER_TEMP/bench/result.json" --strict --md "$RUNNER_TEMP/bench/compare.md"
          code=$?
          cat "$RUNNER_TEMP/bench/compare.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: 初めて読む物差しを測る（パックなし・1 年目 → 規則 → 残りの年度。mushitaro/moyai#67）
        run: node scripts/bench/pack-bench.mjs waste-incineration --first-read --out "$RUNNER_TEMP/bench-first-read"
      - name: 記録した表（eval/bench/waste-incineration/first-read/）と比べる（数が違えば落ちる）
        run: |
          set +e
          node scripts/bench/compare.mjs eval/bench/waste-incineration/first-read/result.json "$RUNNER_TEMP/bench-first-read/result.json" --strict --md "$RUNNER_TEMP/bench-first-read/compare.md"
          code=$?
          cat "$RUNNER_TEMP/bench-first-read/compare.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code

  # シナリオテスト D1・D2（docs/scenarios.md）：e2e（tests/e2e）と walkthrough（tests/demo）を、ubuntu と windows の Chrome で。
  # 落ちた試験があれば落ちる。ファイルごとの数を scenario の仕事に渡す
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: 依存を入れる（npm 11、スクリプトは走らせない）
        run: npx -y npm@11.21.1 ci --ignore-scripts
      - name: ビルド（e2e は dist/cli.js を起こす）
        run: npm run build
      - name: e2e と walkthrough（入っている Chrome。ブラウザは落とさない）
        run: node scripts/scenario/run.mjs --part e2e --out-json "${{ runner.temp }}/scenario/e2e-${{ matrix.os }}.json"
      - name: 数を scenario の仕事に渡す
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/scenario/
          if-no-files-found: ignore
          retention-days: 7

  # シナリオテスト（docs/scenarios.md）の自動の印を判定し、表を仕事の要約に書く。
  # 判定はランナーのコード（scripts/scenario/marks.mjs）。この仕事は、ランナーが走りきれば緑（合否は表の字。不合格の印があっても、ここでは落とさない）
  scenario:
    name: scenario
    needs: [test, pack-bench, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: 依存を入れる（npm 11、スクリプトは走らせない）
        run: npx -y npm@11.21.1 ci --ignore-scripts
      - name: e2e の仕事の数を受ける
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: scenario-e2e-*
          path: ${{ runner.temp }}/scenario-e2e
          merge-multiple: true
      - name: 印を判定して表を書く（npm run scenario -- --ci）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOYAI_CI_TEST: ${{ needs.test.result }}
          MOYAI_CI_PACK_BENCH: ${{ needs.pack-bench.result }}
          MOYAI_CI_E2E: ${{ needs.e2e.result }}
        run: node scripts/scenario/run.mjs --ci --e2e-dir "${{ runner.temp }}/scenario-e2e" --out "${{ runner.temp }}/scenario/result.md"
